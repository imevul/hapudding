listen: ":8096"
status:
  listen: "127.0.0.1:9100"
backends:
  - name: server-a
    url: http://127.0.0.1:8097
    disabled: false
  - name: server-b
    url: http://127.0.0.1:8098
    disabled: false
affinity:
  policy: force_reauth
  graylist:
    policy: fail_closed
    # omit clients to default to Infuse; [] disables built-in names
    # clients:
    #   - Infuse
    path_prefixes: []
  new_clients_require: healthy
  store: postgres
  sqlite:
    path: ./data/affinity.db
  postgres:
    url: postgres://hap:hap@localhost:5432/hap?sslmode=disable
  token_ttl: 720h
  device_ttl: 720h
  anon_ttl: 15m
  # Prefer a backend on first password login only (does not override token/device pins).
  # user_affinity:
  #   - ada: server-a
performance:
  auth_timeout: 60s
  cache:
    enabled: true
    max_bytes: 268435456
    max_object: 2097152
    default_ttl: 15m
    max_ttl: 24h
    disk:
      enabled: true
      path: ./data/imgcache
      max_bytes: 1073741824
  library:
    enabled: true
    ttl: 60s
    max_bytes: 67108864
    max_object: 4194304
  coalesce:
    enabled: true
  warm_login:
    enabled: false
  library_concurrency:
    enabled: false
    max: 3
# Keep Jellyfin Web on HAP’s public origin (P2-11). Off by default.
# Jellyfin KnownProxies / published server URI must include HAP (or the ingress).
# web:
#   stay_on_origin:
#     enabled: false
#     rewrite_playlists: true
# Present one Server ID on GET /System/Info* only (F-2a). Off by default.
# Do not invent or persist an id — set a UUID in YAML. Optional name overrides
# ServerName. One Server ID for two databases can make Infuse Library Mode
# worse; keep gray-list fail_closed.
# translate:
#   server_id:
#     enabled: false
#     id: ""
#     name: ""
health:
  interval: 10s
  public_info: true
  jellyfin_health: true
  passive_auth_failures:
    enabled: true
    threshold: 3
    window: 60s
  auth_probe:
    enabled: false
